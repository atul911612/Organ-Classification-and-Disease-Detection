# Organ classification (10 classes: AA, GB, Hepatic, Kidney, Liver, Ovaries,
# Pancreas, Portal, Spleen, UB+prostate+uterus+cervix).
# Point --data at "<dataset publish>/organ_classification_1".
task: organ
model: convnext_tiny        # try: vit_base | swin_tiny | efficientnetv2_s | usfm
img_size: 224
epochs: 40
batch_size: 32
lr: 0.0003
weight_decay: 0.05
drop_rate: 0.1
val_size: 0.15
test_size: 0.15
patience: 10
seed: 42
